<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1220" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="MpesaTrack — a calm, clear view of your M-Pesa money." />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Apply the saved theme before first paint (aurora dark is the default)
      try {
        if (localStorage.getItem('pesatrack-theme') === 'paper') {
          document.documentElement.classList.add('paper');
          var scheme = document.querySelector('meta[name="color-scheme"]');
          if (scheme) scheme.setAttribute('content', 'light');
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', '#F7F5F0');
        }
      } catch (e) {}
    </script>
    <title>MpesaTrack — Your money, clearly.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
